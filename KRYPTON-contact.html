<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYPTON - About Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="title">
        <h1>KRYPTON</h1>

        <div class="links">
            <a href="KRYTPON-home.html">Home</a>
            <a href="KRYPTON-services.html">Services</a>
            <a href="KRYPTON-our-work.html">Our Work</a>
            <a href="KRYPTON-about.html">About Us</a>
            <a href="KRYPTON-contact.html">Contact</a>
        </div>
    <div style="margin-bottom: 65px; margin-top: 80px;" >


    <h2 style="margin: 0; font-size: 58px; line-height: 1; letter-spacing: -2px;">
      Let's build<br>
      something.
    </h2>

    <p style="margin: 20px 0 0 0; font-size: 18px; max-width: 500px; line-height: 1.5;">
      Have an idea? Tell us what you're working on and let's turn it into something great.
    </p>

  </div>


  <form action="https://formsubmit.co/shaanskooner@gmail.com" method="POST">

    <div style="display: flex; gap: 30px; margin-bottom: 35px;">

      <div style="flex: 1;">

        <label
          for="name"
          style="display: block; margin-bottom: 10px; font-size: 17px; font-weight: bold;"
        >
          Name
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
          required
          style="width: 100%; padding: 18px; border: 2px solid black; background: white; font-size: 16px; box-sizing: border-box;"
        >

      </div>


      <div style="flex: 1;">

        <label
          for="email"
          style="display: block; margin-bottom: 10px; font-size: 17px; font-weight: bold;"
        >
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@email.com"
          required
          style="width: 100%; padding: 18px; border: 2px solid black; background: white; font-size: 16px; box-sizing: border-box;"
        >

      </div>

    </div>


    <div style="margin-bottom: 35px;">

      <label
        for="project"
        style="display: block; margin-bottom: 10px; font-size: 17px; font-weight: bold;"
      >
        Project Details
      </label>

      <textarea
        id="project"
        name="project_details"
        placeholder="What are you looking to build?"
        required
        style="width: 100%; height: 180px; padding: 18px; border: 2px solid black; background: white; font-size: 16px; font-family: Arial, sans-serif; resize: vertical; box-sizing: border-box;"
      ></textarea>

    </div>


    <div style="margin-bottom: 35px;">

      <label
        for="budget"
        style="display: block; margin-bottom: 10px; font-size: 17px; font-weight: bold;"
      >
        Budget
      </label>

      <select
        id="budget"
        name="budget"
        required
        style="width: 100%; padding: 18px; border: 2px solid black; background: white; font-size: 16px; box-sizing: border-box;"
      >

        <option value="">Select your budget</option>
        <option value="under-1000">Under $1,000</option>
        <option value="1000-5000">$1,000 – $5,000</option>
        <option value="5000-10000">$5,000 – $10,000</option>
        <option value="10000-plus">$10,000+</option>

      </select>

    </div>


    <button
      type="submit"
      style="padding: 18px 35px; background: black; color: white; border: 2px solid black; font-size: 16px; font-weight: bold; cursor: pointer;"
    >
      Send Inquiry →
    </button>

  </form>
</body>


    
</html>
